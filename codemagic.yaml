workflows:
  ios-capacitor-release:
    name: Atomic Fusion iOS (Capacitor)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic-app-store-connect
    environment:
      groups:
        - "Env variables"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.eaconsulting.atomicfusion"
      vars:
        BUNDLE_ID: "com.eaconsulting.atomicfusion"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_MARKETING_VERSION: "1.1.5"
        VITE_REVENUECAT_IOS_API_KEY: "appl_wleIrbzZnDKaUaQgnbmYbTYVxfX"
        VITE_REVENUECAT_DEBUG_LOGS: "false"
        # Temporary diagnostics UI so LevelPlay logs can be copied from TestFlight on Windows.
        VITE_PURCHASE_DEBUG_UI: "true"
        # The LevelPlay app key and ad-unit IDs come from the "Env variables" group.
        VITE_LEVELPLAY_ADAPTER_DEBUG: "true"
        VITE_GAME_CENTER_DAILY_BOARD_GLOBAL_LEADERBOARD_ID: "daily_leaderboard_global"
        VITE_GAME_CENTER_DAILY_COMPOUND_GLOBAL_LEADERBOARD_ID: "daily_compound_fastest"
      xcode: latest
      cocoapods: default
      node: 22.16.0
    scripts:
      - name: Set automatic build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --all-versions 2>/dev/null || true)
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*) LATEST_BUILD_NUMBER=0 ;;
          esac

          CODEMAGIC_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-0}}"
          case "$CODEMAGIC_BUILD_NUMBER" in
            ''|*[!0-9]*) CODEMAGIC_BUILD_NUMBER=0 ;;
          esac

          CURRENT_PROJECT_BUILD_NUMBER=$(cd ios/App && xcrun agvtool what-version -terse 2>/dev/null | tail -n 1 || true)
          case "$CURRENT_PROJECT_BUILD_NUMBER" in
            ''|*[!0-9]*) CURRENT_PROJECT_BUILD_NUMBER=0 ;;
          esac

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          if [ "$CURRENT_PROJECT_BUILD_NUMBER" -ge "$NEW_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$((CURRENT_PROJECT_BUILD_NUMBER + 1))
          fi
          if [ "$CODEMAGIC_BUILD_NUMBER" -gt "$NEW_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER="$CODEMAGIC_BUILD_NUMBER"
          fi

          echo "APP_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$CM_ENV"
          echo "Latest TestFlight build: $LATEST_BUILD_NUMBER"
          echo "Current project build: $CURRENT_PROJECT_BUILD_NUMBER"
          echo "Codemagic build number: $CODEMAGIC_BUILD_NUMBER"
          echo "Using iOS build number: $NEW_BUILD_NUMBER"
      - name: Install dependencies
        script: |
          npm install
      - name: Clean generated build artifacts
        script: |
          rm -rf dist .tanstack node_modules/.vite ios/App/App/public
      - name: Sync iOS App Icon from project logo
        script: |
          sips -z 1024 1024 src/logo.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Prepare Vite iOS env
        script: |
          RC_KEY="${VITE_REVENUECAT_IOS_API_KEY:-${REVENUECAT_IOS_API_KEY:-${VITE_REVENUECAT_API_KEY:-${VITE_RC_IOS_API_KEY:-}}}}"
          RC_ENTITLEMENT="${VITE_REVENUECAT_ENTITLEMENT_ID:-${REVENUECAT_ENTITLEMENT_ID:-atomic_fusion_lifetime}}"
          RC_OFFERING="${VITE_REVENUECAT_OFFERING_ID:-${REVENUECAT_OFFERING_ID:-default}}"
          LEVELPLAY_APP_ID="${VITE_LEVELPLAY_IOS_APP_ID:-}"
          LEVELPLAY_INTERSTITIAL="${VITE_LEVELPLAY_IOS_INTERSTITIAL_ID:-}"
          LEVELPLAY_REWARDED="${VITE_LEVELPLAY_IOS_REWARDED_ID:-}"
          LEVELPLAY_ADAPTER_DEBUG="${VITE_LEVELPLAY_ADAPTER_DEBUG:-false}"
          GC_DAILY_BOARD_GLOBAL="${VITE_GAME_CENTER_DAILY_BOARD_GLOBAL_LEADERBOARD_ID:-${GAME_CENTER_DAILY_BOARD_GLOBAL_LEADERBOARD_ID:-daily_leaderboard_global}}"
          GC_DAILY_COMPOUND_GLOBAL="${VITE_GAME_CENTER_DAILY_COMPOUND_GLOBAL_LEADERBOARD_ID:-${GAME_CENTER_DAILY_COMPOUND_GLOBAL_LEADERBOARD_ID:-daily_compound_fastest}}"
          FIREBASE_FUNCTIONS_BASE_URL="${VITE_FIREBASE_FUNCTIONS_BASE_URL:-https://europe-west1-atomicfusionrush.cloudfunctions.net}"
          PURCHASE_DEBUG_UI="${VITE_PURCHASE_DEBUG_UI:-false}"
          RC_DEBUG_LOGS="${VITE_REVENUECAT_DEBUG_LOGS:-false}"

          {
            printf 'VITE_REVENUECAT_IOS_API_KEY=%s\n' "$RC_KEY"
            printf 'VITE_REVENUECAT_API_KEY=%s\n' "$RC_KEY"
            printf 'VITE_REVENUECAT_ENTITLEMENT_ID=%s\n' "$RC_ENTITLEMENT"
            printf 'VITE_REVENUECAT_OFFERING_ID=%s\n' "$RC_OFFERING"
            printf 'VITE_REVENUECAT_DEBUG_LOGS=%s\n' "$RC_DEBUG_LOGS"
            printf 'VITE_PURCHASE_DEBUG_UI=%s\n' "$PURCHASE_DEBUG_UI"
            printf 'VITE_LEVELPLAY_IOS_APP_ID=%s\n' "$LEVELPLAY_APP_ID"
            printf 'VITE_LEVELPLAY_IOS_INTERSTITIAL_ID=%s\n' "$LEVELPLAY_INTERSTITIAL"
            printf 'VITE_LEVELPLAY_IOS_REWARDED_ID=%s\n' "$LEVELPLAY_REWARDED"
            printf 'VITE_LEVELPLAY_ADAPTER_DEBUG=%s\n' "$LEVELPLAY_ADAPTER_DEBUG"
            printf 'VITE_GAME_CENTER_DAILY_BOARD_GLOBAL_LEADERBOARD_ID=%s\n' "$GC_DAILY_BOARD_GLOBAL"
            printf 'VITE_GAME_CENTER_DAILY_COMPOUND_GLOBAL_LEADERBOARD_ID=%s\n' "$GC_DAILY_COMPOUND_GLOBAL"
            printf 'VITE_FIREBASE_FUNCTIONS_BASE_URL=%s\n' "$FIREBASE_FUNCTIONS_BASE_URL"
            printf 'VITE_APP_VERSION=%s\n' "$APP_MARKETING_VERSION"
          } > .env.production.local

          if [ -z "$RC_KEY" ]; then
            echo "ERROR: RevenueCat API key is missing. Set one of these Codemagic environment variables: VITE_REVENUECAT_IOS_API_KEY, REVENUECAT_IOS_API_KEY, VITE_REVENUECAT_API_KEY, or VITE_RC_IOS_API_KEY."
            exit 1
          fi

          if [ -z "$APP_MARKETING_VERSION" ]; then
            echo "ERROR: APP_MARKETING_VERSION is missing."
            exit 1
          fi

          if [ -z "$LEVELPLAY_APP_ID" ]; then
            echo "ERROR: LevelPlay iOS app key is missing. Set VITE_LEVELPLAY_IOS_APP_ID in the Codemagic Env variables group."
            exit 1
          fi

          if [ -z "$LEVELPLAY_INTERSTITIAL" ]; then
            echo "ERROR: LevelPlay iOS interstitial ad-unit ID is missing. Set VITE_LEVELPLAY_IOS_INTERSTITIAL_ID."
            exit 1
          fi

          if [ -z "$LEVELPLAY_REWARDED" ]; then
            echo "ERROR: LevelPlay iOS rewarded ad-unit ID is missing. Set VITE_LEVELPLAY_IOS_REWARDED_ID."
            exit 1
          fi
      - name: Build web + sync Capacitor iOS
        script: |
          npm run cap:sync
      - name: Enforce iOS deployment target
        script: |
          sed -i '' 's/platform :ios, '\''[0-9.]*'\''/platform :ios, '\''15.0'\''/g' ios/App/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]\\+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Inject GoogleService-Info.plist into Build Bundle
        script: |
          PLIST_PATH="ios/App/App/GoogleService-Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            echo "GoogleService-Info.plist hittades. Injekterar byggsteg i Xcode via Ruby..."
            cat << 'EOF' > fix_plist.rb
            require 'xcodeproj'
            project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            target = project.targets.find { |t| t.name == 'App' }
            phase_name = 'Force Firebase Plist'
            unless target.build_phases.any? { |p| p.name == phase_name }
              phase = project.new(Xcodeproj::Project::Object::PBXShellScriptBuildPhase)
              phase.name = phase_name
              phase.shell_script = 'cp -f "${SRCROOT}/App/GoogleService-Info.plist" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/GoogleService-Info.plist"'
              target.build_phases << phase
              project.save
              puts 'Skriptfas tillagd i Xcode-projektet!'
            end
          EOF
            ruby fix_plist.rb
            rm fix_plist.rb
          else
            echo "ERROR: ios/App/App/GoogleService-Info.plist saknas i ditt kodarkiv!"
            exit 1
          fi
      - name: Ensure iOS runtime settings
        script: |
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" ios/App/App/Info.plist
          echo "Using Unity LevelPlay mediation with the Unity Ads adapter"
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update --clean-install
          if ! grep -q "IronSourceSDK (9.6.0.0)" Podfile.lock; then
            echo "ERROR: LevelPlay SDK 9.6.0 was not installed by CocoaPods. Current Podfile:"
            cat Podfile
            exit 1
          fi
          if ! grep -q "IronSourceUnityAdsAdapter (5.10.0.0)" Podfile.lock; then
            echo "ERROR: Unity Ads LevelPlay adapter 5.10.0 was not installed by CocoaPods. Current Podfile:"
            cat Podfile
            exit 1
          fi
          if ! grep -q "UnityAds (4.20.0)" Podfile.lock; then
            echo "ERROR: Unity Ads 4.20.0 was not installed through the LevelPlay adapter. Current Podfile:"
            cat Podfile
            exit 1
          fi
      - name: Auto-increment iOS build number
        script: |
          cd ios/App
          if [ -n "$APP_MARKETING_VERSION" ]; then
            xcrun agvtool new-marketing-version "$APP_MARKETING_VERSION"
          fi
          BUILD_NO="${APP_BUILD_NUMBER}"
          CURRENT_BUILD_NO=$(xcrun agvtool what-version -terse 2>/dev/null | tail -n 1 || true)
          if ! [[ "$BUILD_NO" =~ ^[0-9]+$ ]] || ! [[ "$CURRENT_BUILD_NO" =~ ^[0-9]+$ ]] || [ "$BUILD_NO" -le "$CURRENT_BUILD_NO" ]; then
            echo "ERROR: Auto-incremented iOS build number is invalid: $BUILD_NO (current project build: $CURRENT_BUILD_NO)"
            exit 1
          fi
          xcrun agvtool new-version -all "$BUILD_NO"
          echo "Set iOS build number to $BUILD_NO"
      - name: Set up iOS signing
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Verify iOS Game Center signing entitlement
        script: |
          echo "Checking installed App Store provisioning profiles for Game Center entitlement..."
          FOUND_PROFILE_WITH_GAME_CENTER=false
          for PROFILE in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -f "$PROFILE" ] || continue
            PROFILE_PLIST="$(mktemp)"
            security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST" 2>/dev/null || true)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST" 2>/dev/null || true)
            HAS_GAME_CENTER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.game-center" "$PROFILE_PLIST" 2>/dev/null || true)
            echo "Profile: ${PROFILE_NAME:-unknown} | App ID: ${APP_ID:-unknown} | Game Center: ${HAS_GAME_CENTER:-missing}"
            case "$APP_ID" in
              *".$BUNDLE_ID")
                if [ "$HAS_GAME_CENTER" = "true" ]; then
                  FOUND_PROFILE_WITH_GAME_CENTER=true
                fi
                ;;
            esac
            rm -f "$PROFILE_PLIST"
          done

          if [ "$FOUND_PROFILE_WITH_GAME_CENTER" != "true" ]; then
            echo "ERROR: No installed App Store provisioning profile for $BUNDLE_ID includes com.apple.developer.game-center."
            echo "Regenerate the App Store distribution provisioning profile in Apple Developer Certificates, Identifiers & Profiles, then fetch/upload that new .mobileprovision in Codemagic."
            exit 1
          fi
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - erik.abrahamsson@live.com
        notify:
          success: true
          failure: true
